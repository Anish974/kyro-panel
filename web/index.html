    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://kyro-panel.onrender.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent FOUC for Dark Theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('kyro_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] dark:bg-[#0F1115] text-[#181A20] dark:text-[#F9FAFB] antialiased selection:bg-gray-200 dark:selection:bg-gray-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
