# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service, serving the API and the built web app from the same origin.
#
# Why a web service and not a serverless function: the panel keeps the whole
# interview in memory (server/src/panel/model.ts) and /events is a long-lived
# SSE stream. A platform that cold-starts between requests, or spreads them
# across instances, loses the interview mid-sentence.
#
# Deploy: push this file, then in Render pick "New > Blueprint" and point it at
# the repo. Render prompts for every secret below — none of them live in git.

services:
  - type: web
    name: kyro-panel
    runtime: node
    # Closest region to India. The candidate's audio round-trips through here,
    # so this is the one setting that shows up as felt latency in the room.
    region: singapore
    # ponytail: free tier sleeps after 15 minutes idle, and a sleeping server
    # has forgotten every interview it was holding. The web app copes — a
    # session id the server no longer knows starts a fresh interview instead of
    # failing (web/src/lib/session.ts) — so a candidate arriving cold is fine.
    # What is NOT fine is sleeping mid-interview, which loses it outright. Move
    # to starter before anyone real is in the room.
    plan: free

    # Render sets NODE_ENV=production, which makes a plain `npm ci` skip
    # devDependencies — and vite lives there, so the web build would fail.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 22.13.1

      # sync: false means "prompt for this in the dashboard" — never a value
      # in this file, which is committed.
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false

      # The RESTful API credentials, from the Agora console. The server needs
      # them because the room starts the AI panel itself (POST /agent/start) —
      # an interview needs a browser and nothing else. They used to live only on
      # the operator's laptop, back when `npm run agent:start` was the only way
      # in. Anything that can read these can create billable agents.
      - key: AGORA_CUSTOMER_ID
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false

      # AGORA_CHANNEL is deliberately absent. There is no fixed room any more:
      # every interview gets its own channel, named at sign-in, and /token mints
      # only for a channel with a live interview behind it. Setting this again
      # would buy nothing — the server refuses that channel like any other with
      # nobody in it — and would only suggest a shared room still exists.
      #
      # Agora sends this straight back as the Authorization header on every
      # turn. Without it every /chat/completions is a 401 and the panel is mute.
      - key: ORCHESTRATOR_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
